<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>愤怒的坤坤 · 弹弓弹射</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #1b2430; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 12px; }
  h1 { color: #f4d35e; font-size: 20px; margin-bottom: 8px; letter-spacing: 2px; }
  #wrap { width: 100%; max-width: 960px; }
  canvas { display: block; width: 100%; height: auto; border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.5); background: #87ceeb; touch-action: none; cursor: crosshair; }
  #bar { display: flex; gap: 16px; color: #e8eef5; font-size: 14px; padding: 10px 4px; flex-wrap: wrap; align-items: center; }
  #bar b { color: #f4d35e; }
  #restartBtn {
    padding: 6px 16px; font-size: 13px; border: none; border-radius: 16px; cursor: pointer;
    background: #f4d35e; color: #1b2430; font-weight: 700; letter-spacing: 1px;
  }
  #restartBtn:hover { background: #ffd94a; }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(15,20,28,.72); border-radius: 12px; color: #fff; gap: 14px; text-align: center;
  }
  #overlay h2 { font-size: 34px; letter-spacing: 3px; }
  #overlay p { color: #cdd7e1; font-size: 15px; }
  #overlay button {
    padding: 10px 28px; font-size: 16px; border: none; border-radius: 24px; cursor: pointer;
    background: #f4d35e; color: #1b2430; font-weight: 700; letter-spacing: 1px;
  }
  #stage { position: relative; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <h1>愤怒的坤坤 · 弹弓弹射</h1>
  <div id="wrap">
    <div id="bar">
      <span>关卡：<b id="lv">1</b>/<b id="lvTotal">5</b></span>
      <span>剩余弹药：<b id="ammo">3</b></span>
      <span>剩余目标：<b id="targets">1</b></span>
      <span style="margin-left:auto">按住弹弓向后拉，松手发射；积木被击中后才会倒塌</span>
      <button id="restartBtn">重开本关</button>
    </div>
    <div id="stage">
      <canvas id="cv" width="960" height="540"></canvas>
      <div id="overlay" class="hidden">
        <h2 id="ovTitle">胜利</h2>
        <p id="ovText"></p>
        <button id="ovBtn">下一关</button>
      </div>
    </div>
  </div>

<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const W = 960, H = 540, GROUND = 490;
  const ANCHOR = { x: 150, y: 430 };
  const MAXPULL = 95;
  const G = 0.38;

  let AC = null;
  function initAudio() {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  }
  function tone(freq, dur, type, vol, delay = 0) {
    if (!AC) return;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    const t = AC.currentTime + delay;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur);
  }
  function noise(dur, vol, delay = 0, cutoff = 400) {
    if (!AC) return;
    const len = Math.floor(AC.sampleRate * dur);
    const buf = AC.createBuffer(1, len, AC.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = AC.createBufferSource(); src.buffer = buf;
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
    const g = AC.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(AC.destination);
    src.start(AC.currentTime + delay);
  }
  const sfxShoot = () => { noise(0.18, 0.22, 0, 900); tone(220, 0.15, 'sine', 0.12); };
  const sfxHitBlock = () => { noise(0.12, 0.28, 0, 300); tone(90, 0.15, 'square', 0.14); };
  const sfxHitTarget = () => { tone(880, 0.12, 'sine', 0.25); tone(1320, 0.1, 'sine', 0.15, 0.06); };
  const sfxLand = () => noise(0.08, 0.15, 0, 200);
  const sfxWin = () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, 'sine', 0.2, i * 0.12));
  const sfxLose = () => [400, 320, 240].forEach((f, i) => tone(f, 0.25, 'triangle', 0.16, i * 0.15));

  const LEVELS = [
    {
      ammo: 3,
      blocks: [ {x: 700, y: 472, w: 180, h: 18, type:'wood'} ],
      targets: [ {x: 790, y: 446, r: 26, hp: 2} ]
    },
    {
      ammo: 3,
      blocks: [
        {x: 640, y: 450, w: 28, h: 40, type:'stone'},
        {x: 820, y: 450, w: 28, h: 40, type:'stone'},
        {x: 640, y: 432, w: 208, h: 18, type:'wood'}
      ],
      targets: [ {x: 744, y: 406, r: 24, hp: 2}, {x: 890, y: 466, r: 22, hp: 2} ]
    },
    {
      ammo: 4,
      blocks: [
        {x: 720, y: 472, w: 120, h: 18, type:'wood'},
        {x: 735, y: 454, w: 90, h: 18, type:'wood'},
        {x: 748, y: 436, w: 64, h: 18, type:'wood'}
      ],
      targets: [ {x: 780, y: 410, r: 22, hp: 2}, {x: 870, y: 466, r: 22, hp: 2} ]
    },
    {
      ammo: 4,
      blocks: [
        {x: 700, y: 472, w: 30, h: 18, type:'stone'},
        {x: 760, y: 440, w: 30, h: 50, type:'stone'},
        {x: 700, y: 422, w: 150, h: 18, type:'wood'}
      ],
      targets: [ {x: 730, y: 466, r: 22, hp: 2}, {x: 800, y: 396, r: 22, hp: 2} ]
    },
    {
      ammo: 5,
      blocks: [
        {x: 620, y: 450, w: 28, h: 40, type:'stone'},
        {x: 760, y: 450, w: 28, h: 40, type:'stone'},
        {x: 620, y: 432, w: 168, h: 18, type:'wood'},
        {x: 660, y: 472, w: 120, h: 18, type:'wood'}
      ],
      targets: [ {x: 688, y: 406, r: 22, hp: 2}, {x: 820, y: 466, r: 22, hp: 2}, {x: 890, y: 466, r: 22, hp: 2} ]
    }
  ];

  let level = 0;
  let state = 'idle';
  let ball = null;
  let aiming = null;
  let blocks = [], targets = [], ammo = 3;

  const $lv = document.getElementById('lv');
  const $lvTotal = document.getElementById('lvTotal');
  const $ammo = document.getElementById('ammo');
  const $targets = document.getElementById('targets');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText = document.getElementById('ovText');
  const ovBtn = document.getElementById('ovBtn');

  function loadLevel(i) {
    const L = LEVELS[i];
    level = i;
    ammo = L.ammo;
    blocks = L.blocks.map(b => ({
      ...b, vx: 0, vy: 0, ang: 0, av: 0,
      mass: b.type === 'stone' ? 3 : 1.2, landed: false, fixed: true
    }));
    targets = L.targets.map(t => ({...t, flash: 0}));
    ball = null;
    state = 'idle';
    $lvTotal.textContent = LEVELS.length;
    updateHud();
    overlay.classList.add('hidden');
  }

  function updateHud() {
    $lv.textContent = level + 1;
    $ammo.textContent = ammo;
    $targets.textContent = targets.filter(t => t.hp > 0).length;
  }

  function toCanvas(e) {
    const rect = cv.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    return {
      x: (src.clientX - rect.left) * (W / rect.width),
      y: (src.clientY - rect.top) * (H / rect.height)
    };
  }

  function startAim(e) {
    initAudio();
    if (state !== 'idle') return;
    const p = toCanvas(e);
    const dx = p.x - ANCHOR.x, dy = p.y - ANCHOR.y;
    if (Math.hypot(dx, dy) < 130) {
      state = 'aiming';
      aiming = clampPull(p);
    }
  }
  function moveAim(e) {
    if (state !== 'aiming') return;
    aiming = clampPull(toCanvas(e));
  }
  function endAim() {
    if (state !== 'aiming') return;
    const dx = ANCHOR.x - aiming.x;
    const dy = ANCHOR.y - aiming.y;
    ball = {
      x: ANCHOR.x, y: ANCHOR.y, r: 17,
      vx: dx * 0.16, vy: dy * 0.16,
      trail: []
    };
    ammo--;
    state = 'flying';
    aiming = null;
    sfxShoot();
    updateHud();
  }
  function clampPull(p) {
    let dx = p.x - ANCHOR.x, dy = p.y - ANCHOR.y;
    const d = Math.hypot(dx, dy);
    if (d > MAXPULL) { dx = dx / d * MAXPULL; dy = dy / d * MAXPULL; }
    return { x: ANCHOR.x + dx, y: ANCHOR.y + dy };
  }

  cv.addEventListener('mousedown', startAim);
  cv.addEventListener('mousemove', moveAim);
  window.addEventListener('mouseup', endAim);
  cv.addEventListener('touchstart', e => { e.preventDefault(); startAim(e); }, {passive:false});
  cv.addEventListener('touchmove', e => { e.preventDefault(); moveAim(e); }, {passive:false});
  cv.addEventListener('touchend', e => { e.preventDefault(); endAim(); }, {passive:false});

  function stepBlock(b) {
    if (b.fixed) return;
    b.vy += G;
    b.x += b.vx;
    b.y += b.vy;
    b.ang += b.av;
    const half = b.h / 2;
    if (b.y + half > GROUND) {
      b.y = GROUND - half;
      if (!b.landed && Math.abs(b.vy) > 2) sfxLand();
      b.landed = true;
      b.vy *= -0.3;
      b.vx *= 0.92;
      b.av *= 0.92;
    } else {
      b.landed = false;
    }
    b.vx *= 0.995;
    b.av *= 0.985;
    if (Math.abs(b.vx) < 0.02) b.vx = 0;
    if (Math.abs(b.av) < 0.002) b.av = 0;
    if (b.x < -300 || b.x > W + 300) b.vx = 0;
  }

  function overlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function chainUnlock() {
    for (const a of blocks) {
      if (a.fixed) continue;
      for (const b of blocks) {
        if (!b.fixed) continue;
        if (overlap(a, b)) {
          b.fixed = false;
          b.vx = a.vx * 0.7;
          b.vy = a.vy * 0.7;
          b.av += a.vx * 0.03;
        }
      }
    }
  }

  function collideBlock(ball, blk) {
    const cx = Math.max(blk.x, Math.min(ball.x, blk.x + blk.w));
    const cy = Math.max(blk.y, Math.min(ball.y, blk.y + blk.h));
    let dx = ball.x - cx, dy = ball.y - cy;
    let d = Math.hypot(dx, dy);
    if (d < ball.r) {
      if (d === 0) { dx = 0; dy = -1; d = 1; }
      const ux = dx / d, uy = dy / d;
      ball.x = cx + ux * ball.r;
      ball.y = cy + uy * ball.r;
      const vn = ball.vx * ux + ball.vy * uy;
      if (vn < 0) {
        const rest = 0.35;
        ball.vx -= (1 + rest) * vn * ux;
        ball.vy -= (1 + rest) * vn * uy;
        ball.vx *= 0.96; ball.vy *= 0.96;
        const impact = -vn;
        blk.fixed = false;
        blk.vx += ux * impact * 0.9 / blk.mass;
        blk.vy += uy * impact * 0.9 / blk.mass;
        const rx = ball.x - (blk.x + blk.w / 2);
        const ry = ball.y - (blk.y + blk.h / 2);
        blk.av += (rx * uy - ry * ux) * impact * 0.02 / blk.mass;
        if (impact > 1.5) sfxHitBlock();
      }
      return true;
    }
    return false;
  }

  function rectCircle(b, t) {
    const cx = Math.max(b.x, Math.min(t.x, b.x + b.w));
    const cy = Math.max(b.y, Math.min(t.y, b.y + b.h));
    return Math.hypot(t.x - cx, t.y - cy) < t.r;
  }

  function damageTarget(t) {
    if (t.hp <= 0) return;
    t.hp--;
    t.flash = 12;
    sfxHitTarget();
    updateHud();
  }

  function step() {
    if (state === 'flying' && ball) {
      ball.vy += G;
      ball.x += ball.vx;
      ball.y += ball.vy;
      ball.trail.push({x: ball.x, y: ball.y});
      if (ball.trail.length > 18) ball.trail.shift();

      for (const blk of blocks) collideBlock(ball, blk);

      for (const t of targets) {
        if (t.hp <= 0) continue;
        const d = Math.hypot(ball.x - t.x, ball.y - t.y);
        if (d < ball.r + t.r) {
          const nx = (ball.x - t.x) / (d || 1), ny = (ball.y - t.y) / (d || 1);
          ball.vx = nx * 4; ball.vy = ny * 4 - 2;
          damageTarget(t);
        }
      }

      if (ball.y > GROUND - ball.r) {
        ball.y = GROUND - ball.r;
        ball.vy *= -0.4;
        ball.vx *= 0.8;
        if (Math.abs(ball.vy) < 0.6) ball.vy = 0;
      }
      if (ball.x < -60 || ball.x > W + 60 || ball.y > H + 60) endBall();
      else if (Math.abs(ball.vx) < 0.08 && ball.vy === 0 && ball.y >= GROUND - ball.r - 0.5) endBall();
    }

    chainUnlock();
    for (const blk of blocks) stepBlock(blk);

    for (const blk of blocks) {
      for (const t of targets) {
        if (t.hp > 0 && rectCircle(blk, t)) {
          blk.vx *= 0.5; blk.vy *= 0.5;
          damageTarget(t);
        }
      }
    }

    for (const t of targets) if (t.flash > 0) t.flash--;

    if (state === 'flying') {
      if (targets.every(t => t.hp <= 0)) return finish(true);
      if (ammo === 0 && !ball) return finish(false);
    }
  }

  function endBall() {
    ball = null;
    state = ammo > 0 ? 'idle' : 'done';
    updateHud();
    if (ammo === 0 && targets.some(t => t.hp > 0)) finish(false);
  }

  function finish(win) {
    state = 'done';
    overlay.classList.remove('hidden');
    if (win) {
      sfxWin();
      ovTitle.textContent = '漂亮！全部命中';
      ovText.textContent = level + 1 === LEVELS.length ? '你通过了全部关卡！' : '准备进入下一关';
      ovBtn.textContent = level + 1 === LEVELS.length ? '再玩一次' : '下一关';
    } else {
      sfxLose();
      ovTitle.textContent = '弹药耗尽';
      ovText.textContent = '差一点，重新挑战这一关';
      ovBtn.textContent = '重试本关';
    }
  }

  ovBtn.addEventListener('click', () => {
    if (state !== 'done') return;
    const win = targets.every(t => t.hp <= 0);
    if (win && level + 1 < LEVELS.length) loadLevel(level + 1);
    else loadLevel(win ? 0 : level);
  });

  document.getElementById('restartBtn').addEventListener('click', () => loadLevel(level));

  function drawSky() {
    const grd = ctx.createLinearGradient(0, 0, 0, GROUND);
    grd.addColorStop(0, '#7ec8f0');
    grd.addColorStop(1, '#dff1e0');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,236,150,.9)';
    ctx.beginPath(); ctx.arc(860, 80, 34, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#6aa84f';
    ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = '#8b5a2b';
    ctx.fillRect(0, GROUND, W, 10);
  }

  function drawSlingshot() {
    ctx.strokeStyle = '#6b3f1d';
    ctx.lineWidth = 8; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(ANCHOR.x, GROUND);
    ctx.lineTo(ANCHOR.x, ANCHOR.y + 10);
    ctx.moveTo(ANCHOR.x, ANCHOR.y);
    ctx.lineTo(ANCHOR.x - 22, ANCHOR.y - 26);
    ctx.moveTo(ANCHOR.x, ANCHOR.y);
    ctx.lineTo(ANCHOR.x + 22, ANCHOR.y - 26);
    ctx.stroke();
  }

  function drawBall(x, y, r) {
    ctx.fillStyle = '#e87722';
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#7a3d10'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - r, y); ctx.lineTo(x + r, y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, y - r); ctx.lineTo(x, y + r); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('K', x, y + 1);
  }

  function drawAmmoBall() {
    if (state === 'aiming' && aiming) drawBall(aiming.x, aiming.y, 17);
    else if (state === 'idle') drawBall(ANCHOR.x, ANCHOR.y, 17);
  }

  function drawAimLine() {
    if (state !== 'aiming') return;
    const dx = ANCHOR.x - aiming.x, dy = ANCHOR.y - aiming.y;
    ctx.setLineDash([6, 8]);
    ctx.strokeStyle = 'rgba(255,255,255,.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(ANCHOR.x, ANCHOR.y);
    ctx.lineTo(ANCHOR.x + dx * 1.4, ANCHOR.y + dy * 1.4);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawBlocks() {
    for (const b of blocks) {
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      ctx.rotate(b.ang);
      ctx.fillStyle = b.type === 'stone' ? '#9aa3ab' : '#a5672f';
      ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
      ctx.strokeStyle = 'rgba(0,0,0,.25)';
      ctx.lineWidth = 2;
      ctx.strokeRect(-b.w / 2, -b.h / 2, b.w, b.h);
      ctx.restore();
    }
  }

  function drawTargets() {
    for (const t of targets) {
      if (t.hp <= 0) continue;
      const flash = t.flash > 0;
      ctx.fillStyle = flash ? '#ff5d73' : '#5b2d8e';
      ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#f4d35e'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 20px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('24', t.x, t.y + 1);
    }
  }

  function drawFlyingBall() {
    if (!ball) return;
    ctx.setLineDash([4, 6]);
    ctx.strokeStyle = 'rgba(255,255,255,.5)';
    for (let i = 1; i < ball.trail.length; i++) {
      ctx.beginPath();
      ctx.moveTo(ball.trail[i - 1].x, ball.trail[i - 1].y);
      ctx.lineTo(ball.trail[i].x, ball.trail[i].y);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    drawBall(ball.x, ball.y, ball.r);
  }

  function loop() {
    step();
    ctx.clearRect(0, 0, W, H);
    drawSky();
    drawBlocks();
    drawTargets();
    drawSlingshot();
    drawAimLine();
    drawAmmoBall();
    drawFlyingBall();
    requestAnimationFrame(loop);
  }

  loadLevel(0);
  loop();
})();
</script>
</body>
</html>
